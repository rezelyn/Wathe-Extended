name: Bug report
description: Report a bug in Wathe Extended
title: "[Bug] "
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: >-
        Read CONTRIBUTORS.md before submitting. Issues from users running the mod outside The Harpy Express: Extended modpack are closed without investigation. Bugs that originate in another add-on must use the “Add-on compatibility bug” template.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I am using unmodified version of The Harpy Express Extended modpack.
          required: true
        - label: I am on the latest version of the modpack and of Wathe Extended.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: modpack-version
    attributes:
      label: Modpack version
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Wathe Extended version
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Side
      multiple: true
      options:
        - Client
        - Server
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash reports
      description: Attach latest.log or the crash report as a file, or provide a mclo.gs link. Do not paste large logs inline.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, video, or anything else that helps.
