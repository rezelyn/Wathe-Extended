name: Add-on compatibility bug
description: Report a bug caused by, or affecting, another supported add-on
title: "[Compatibility] "
labels:
  - Compatibility
body:
  - type: markdown
    attributes:
      value: >-
        Read [CONTRIBUTING.md](../../CONTRIBUTING.md) before submitting. Bugs that originate in another add-on must be reported to that add-on's author first. A fix is considered in this repository only if the upstream issue cannot be resolved in a reasonable time or that mod is no longer maintained.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I am using unmodified version of The Harpy Express Extended modpack
          required: true
        - label: I reported this to the add-on's author, and the upstream report link is provided below.
          required: true
  - type: input
    id: addon-name
    attributes:
      label: Add-on name
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
    validations:
      required: true
  - type: input
    id: upstream-report
    attributes:
      label: Upstream report
      description: Link to the report filed with the add-on's author.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: modpack-version
    attributes:
      label: Modpack version
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Wathe Extended version
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Side
      multiple: true
      options:
        - Client
        - Server
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash reports
      description: Attach latest.log or the crash report as a file, or provide a mclo.gs link. Do not paste large logs inline.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Why is a fix needed in this repository rather than upstream?
