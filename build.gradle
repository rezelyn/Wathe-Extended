plugins {
    id 'fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    // Dev-only logging config: only Wathe Extended's own log output is shown.
    log4jConfigs.setFrom(file("log4j-dev.xml"))

    mods {
        "watheextended" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            getJvmArguments().add('--enable-native-access=ALL-UNNAMED')
        }
    }

    // Debug-only: verbose injector reporting, and dump every transformed class to
    // run/.mixin.out so applied handlers can be inspected directly.
    // runs.configureEach {
    //     getJvmArguments().add("-Dmixin.debug.verbose=true")
    //     getJvmArguments().add("-Dmixin.debug.export=true")
    // }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Ladysnake Mods"
        url = "https://maven.ladysnake.org/releases"
    }
    maven {
        name = "Datasync"
        url = "https://maven.uuid.gg/releases"
    }
    maven {
        name = "MaxHenkel"
        url = "https://maven.maxhenkel.de/releases"
    }
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "WispForest"
        url = "https://maven.wispforest.io/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Wathe
    modApi "dev.doctor4t:wathe:${project.wathe_version}"

    // Harpy Mod Loader and Addons
    modApi "maven.modrinth:harpymodloader:${project.harpymodloader_version}"

    modApi "maven.modrinth:noelles-roles-tmm:${project.noelles_roles_version}"
    modApi "maven.modrinth:stupid-express:${project.stupid_express_version}"
    modApi "maven.modrinth:starexpress:${project.starexpress_version}"
    modApi "maven.modrinth:kinswathe:${project.kinswathe_version}"

    // Cardinal Components API and Ratatouille
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}"
    modImplementation "dev.doctor4t:ratatouille:${project.ratatouille_version}"

    // Libraries
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzzyConfigVersion}"
    annotationProcessor modImplementation("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-sentinel:${project.owo_version}"

    modCompileOnly fileTree(dir: 'libs', include: '*.jar')

    // Simple Voice Chat
    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    modRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}:fabric-stub"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_mod_version}"

    // Optional dependencies
    modRuntimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modRuntimeOnly "maven.modrinth:carpet:${project.carpet_version}"
    modRuntimeOnly "maven.modrinth:playercontrol:${project.playercontrol_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {}
}
